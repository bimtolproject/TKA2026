        function getQuestionList(subjectKey, count, level) {
            const list = [];
            const isEval = EVALUATION_LEVELS.includes(level);
            const isSpecial = level >= 21 && level <= 25;
            const isFinal = level === 26;
            const subBank = window.MASTER_QUESTION_BANK[subjectKey] || {};

            if (isFinal) {
                let questionNo = 1;
                for (let l = 1; l <= 25; l++) {
                    const lQuestions = subBank[l] || [];
                    for (let i = 0; i < 5; i++) {
                        if (lQuestions[i]) {
                            list.push({
                                id: `L26-${subjectKey}-Q${questionNo}`,
                                q: `${questionNo}. [SOAL MASTER UJIAN AKHIR - DARI LEVEL ${l}] ${lQuestions[i].q}`,
                                options: lQuestions[i].options,
                                correct: lQuestions[i].correct
                            });
                            questionNo++;
                        }
                    }
                }
            } 
            else if (isEval) {
                const startPrevLevel = level - 4;
                let questionNo = 1;
                const distribution = [13, 12, 13, 12];

                for (let idx = 0; idx < 4; idx++) {
                    const targetL = startPrevLevel + idx;
                    const quota = distribution[idx];
                    const lQuestions = subBank[targetL] || [];

                    for (let i = 0; i < quota; i++) {
                        if (lQuestions[i]) {
                            list.push({
                                id: `L${level}-${subjectKey}-EVAL-from-L${targetL}-${i+1}`,
                                q: `${questionNo}. [EVALUASI LEVEL ${targetL}] ${lQuestions[i].q}`,
                                options: lQuestions[i].options,
                                correct: lQuestions[i].correct
                            });
                            questionNo++;
                        }
                    }
                }
            } 
            else if (isSpecial) {
                const specialQuestions = subBank[level] || [];
                for (let i = 1; i <= 50; i++) {
                    if (specialQuestions[i - 1]) {
                        const qData = specialQuestions[i - 1];
                        list.push({
                            id: `L${level}-${subjectKey}-${i}`,
                            q: `${i}. ${qData.q}`,
                            options: qData.options,
                            correct: qData.correct
                        });
                    }
                }
            } 
            else {
                const currentQuestions = subBank[level] || [];
                for (let i = 1; i <= count; i++) {
                    if (currentQuestions[i - 1]) {
                        const qData = currentQuestions[i - 1];
                        list.push({
                            id: `L${level}-${subjectKey}-${i}`,
                            q: `${i}. ${qData.q}`,
                            options: qData.options,
                            correct: qData.correct
                        });
                    }
                }
            }
            return list;
        }

        function getStorageProgress() {
            return JSON.parse(localStorage.getItem('tka_final_26_progress')) || {};
        }

        function saveAnswer(questionId, selectedIdx) {
            const progress = getStorageProgress();
            progress[questionId] = selectedIdx;
            localStorage.setItem('tka_final_26_progress', JSON.stringify(progress));
        }

        function initLevelDropdown() {
            const select = document.getElementById('levelSelect');
            select.innerHTML = '';
            for (let l = 1; l <= 26; l++) {
                const isEval = EVALUATION_LEVELS.includes(l);
                const isSpecial = l >= 21 && l <= 25;
                const isFinal = l === 26;

                const option = document.createElement('option');
                option.value = l;

                if (isFinal) {
                    option.textContent = `Level 26 ★ (MASTER EXAM FINAL)`;
                } else if (isSpecial) {
                    option.textContent = `Level ${l} ◆ (50 Soal)`;
                } else if (isEval) {
                    option.textContent = `Level ${l} ★ (50 Soal Evaluasi)`;
                } else {
                    option.textContent = `Level ${l} (25 Soal)`;
                }

                if (l === currentLevel) option.selected = true;
                select.appendChild(option);
            }
        }

        function changeLevel(level) {
            currentLevel = parseInt(level);
            localStorage.setItem('user_level', currentLevel);
            renderLevelUI();
        }

        function switchSubject(subjectKey) {
            activeSubject = subjectKey;
            
            document.querySelectorAll('#subjectTabs button').forEach(btn => {
                if (btn.getAttribute('data-subject') === subjectKey) {
                    btn.className = "tab-link px-4 py-2 font-semibold text-blue-600 border-b-2 border-blue-600";
                } else {
                    btn.className = "tab-link px-4 py-2 font-medium text-gray-500 hover:text-blue-600 transition";
                }
            });

            renderLevelUI();
        }

        function renderLevelUI() {
            const isEval = EVALUATION_LEVELS.includes(currentLevel);
            const isSpecial = currentLevel >= 21 && currentLevel <= 25;
            const isFinal = currentLevel === 26;

            let targetCount = 25;
            if (isFinal) targetCount = 125;
            else if (isEval || isSpecial) targetCount = 50;

            const currentTopic = SYLLABUS[activeSubject][currentLevel];
            
            const banner = document.getElementById('levelBanner');
            const title = document.getElementById('levelTitle');
            const desc = document.getElementById('levelDesc');
            const infoBox = document.getElementById('materialInfo');

            if (isFinal) {
                banner.className = "p-4 rounded-xl mb-6 flex justify-between items-center text-white shadow-md bg-gradient-to-r from-red-700 to-rose-900";
                title.innerText = `Level 26 (Ujian Akhir Master)`;
                desc.innerText = `Ujian Akhir: Pengulangan Level 1 s.d 25`;
            } else if (isSpecial) {
                banner.className = "p-4 rounded-xl mb-6 flex justify-between items-center text-white shadow-md bg-gradient-to-r from-amber-600 to-orange-800";
                title.innerText = `Level ${currentLevel} (Pengayaan Spesial)`;
                desc.innerText = `Materi Tambahan: ${targetCount} Soal per Mapel`;
            } else if (isEval) {
                const startL = currentLevel - 4;
                banner.className = "p-4 rounded-xl mb-6 flex justify-between items-center text-white shadow-md bg-gradient-to-r from-purple-700 to-indigo-900";
                title.innerText = `Level ${currentLevel} (Ujian Evaluasi Pemerataan)`;
                desc.innerText = `Ulangan Terbagi Rata: 50 Soal dari Level ${startL} s.d ${currentLevel - 1}`;
            } else {
                banner.className = "p-4 rounded-xl mb-6 flex justify-between items-center text-white shadow-md bg-gradient-to-r from-blue-700 to-blue-900";
                title.innerText = `Level ${currentLevel}`;
                desc.innerText = `Latihan Reguler: ${targetCount} Soal per Mapel`;
            }

            infoBox.innerHTML = `
                <div class="flex items-center gap-2">
                    <span class="font-bold text-blue-800 uppercase">Materi ${activeSubject.toUpperCase()} (Level ${currentLevel}):</span>
                    <span class="font-semibold text-blue-900 bg-white px-3 py-1 rounded border border-blue-200">${currentTopic}</span>
                </div>
            `;

            renderQuestions();
        }

        function renderQuestions() {
            const isEval = EVALUATION_LEVELS.includes(currentLevel);
            const isSpecial = currentLevel >= 21 && currentLevel <= 25;
            const isFinal = currentLevel === 26;

            let questionCount = 25;
            if (isFinal) questionCount = 125;
            else if (isEval || isSpecial) questionCount = 50;

            const questions = getQuestionList(activeSubject, questionCount, currentLevel);
            const savedProgress = getStorageProgress();
            
            // Perhitungan Statistik Skor
            let correctCount = 0;
            let wrongCount = 0;
            let answeredCount = 0;

            questions.forEach(q => {
                const ans = savedProgress[q.id];
                if (ans !== undefined) {
                    answeredCount++;
                    if (ans === q.correct) {
                        correctCount++;
                    } else {
                        wrongCount++;
                    }
                }
            });

            const score = (correctCount / questionCount) * 100;
            const scoreFormatted = score.toFixed(1);

            // Render Panel Skor Nilai
            const scorePanel = document.getElementById('scorePanel');
            scorePanel.innerHTML = `
                <div class="flex flex-wrap items-center justify-between gap-4 text-sm">
                    <div class="flex items-center gap-3">
                        <span class="font-bold text-gray-700">Skor Nilai:</span>
                        <span class="text-2xl font-extrabold ${score >= 70 ? 'text-green-600' : 'text-red-600'} bg-gray-100 px-3 py-1 rounded-lg border">
                            ${scoreFormatted} / 100
                        </span>
                    </div>
                    <div class="flex items-center gap-4 text-xs md:text-sm font-semibold">
                        <span class="bg-green-100 text-green-800 px-3 py-1.5 rounded-lg border border-green-200">
                            Benar: <strong>${correctCount}</strong>
                        </span>
                        <span class="bg-red-100 text-red-800 px-3 py-1.5 rounded-lg border border-red-200">
                            Salah: <strong>${wrongCount}</strong>
                        </span>
                        <span class="bg-blue-100 text-blue-800 px-3 py-1.5 rounded-lg border border-blue-200">
                            Progress: <strong>${answeredCount} / ${questionCount}</strong>
                        </span>
                    </div>
                </div>
            `;

            const area = document.getElementById('contentArea');
            
            let html = `
                <div class="bg-white rounded-xl shadow-md p-6 border-l-4 ${isFinal ? 'border-red-600' : (isSpecial ? 'border-amber-600' : (isEval ? 'border-purple-600' : 'border-blue-600'))}">
                    <div class="flex flex-col md:flex-row justify-between items-start md:items-center mb-6 border-b pb-4 gap-2">
                        <div>
                            <h3 class="text-lg font-bold text-gray-800">Soal ${activeSubject.toUpperCase()} - Level ${currentLevel}</h3>
                            <p class="text-xs text-gray-500">${isFinal ? `Ujian Akhir Master (${questionCount} Soal)` : (isEval ? `Ujian Pengulangan Pemerataan (${questionCount} Soal)` : `Materi: ${SYLLABUS[activeSubject][currentLevel]}`)}</p>
                        </div>
                        <span class="text-xs bg-green-100 text-green-800 font-semibold px-3 py-1 rounded-full border border-green-300">
                            Auto-Saved LocalStorage
                        </span>
                    </div>
                    <div class="space-y-6">
            `;

            questions.forEach((q) => {
                const savedAns = savedProgress[q.id];
                const isAnswered = savedAns !== undefined;

                html += `
                    <div class="p-4 border border-gray-200 rounded-lg bg-gray-50/50 hover:bg-gray-50 transition">
                        <p class="font-semibold text-gray-800 mb-3 leading-relaxed whitespace-pre-line">${q.q}</p>
                        <div class="grid grid-cols-1 md:grid-cols-2 gap-2">
                            ${q.options.map((opt, optIdx) => {
                                let btnStyle = "bg-white border-gray-300 hover:border-blue-500 hover:bg-blue-50/50";
                                if (isAnswered) {
                                    if (optIdx === q.correct) {
                                        btnStyle = "bg-green-100 border-green-600 font-bold text-green-900";
                                    } else if (optIdx === savedAns) {
                                        btnStyle = "bg-red-100 border-red-500 text-red-900";
                                    }
                                }

                                return `
                                    <button 
                                        onclick="handleAnswer('${q.id}', ${optIdx})" 
                                        ${isAnswered ? 'disabled' : ''}
                                        class="text-left p-3 border rounded-lg transition text-sm ${btnStyle}">
                                        <span class="font-bold mr-1">${String.fromCharCode(65 + optIdx)}.</span> ${opt}
                                    </button>
                                `;
                            }).join('')}
                        </div>
                        <div id="msg-${q.id}" class="mt-3 text-xs font-bold">
                            ${isAnswered 
                                ? (savedAns === q.correct 
                                    ? '<span class="text-green-600 bg-green-50 px-2 py-1 rounded border border-green-200">✓ Jawaban Anda Benar!</span>' 
                                    : `<span class="text-red-600 bg-red-50 px-2 py-1 rounded border border-red-200">✕ Jawaban Salah. Kunci Jawaban: ${String.fromCharCode(65 + q.correct)}</span>`)
                                : ''}
                        </div>
                    </div>
                `;
            });

            html += `</div></div>`;
            area.innerHTML = html;

            // Trigger KaTeX untuk render simbol matematika
            renderMathInElement(document.getElementById("contentArea"), {
                delimiters: [
                    {left: "$$", right: "$$", display: true},
                    {left: "$", right: "$", display: false}
                ]
            });
        }

        function handleAnswer(questionId, selectedIdx) {
            saveAnswer(questionId, selectedIdx);
            renderQuestions();
        }

        window.onload = () => {
            initLevelDropdown();
            renderLevelUI();
        };
    </script>
</body>
</html>
