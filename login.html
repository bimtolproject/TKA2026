<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Masuk - Portal TKA SMK</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
        }
    </style>
</head>
<body class="bg-slate-100 text-slate-800 min-h-screen flex items-center justify-center p-4 relative antialiased">

    <!-- Container Card -->
    <main class="w-full max-w-md">
        <div class="bg-white border border-slate-200 rounded-3xl p-8 shadow-xl shadow-slate-200/60">
            
            <!-- Brand / Header Logo -->
            <div class="text-center mb-8">
                <div class="inline-flex items-center justify-center w-14 h-14 rounded-2xl bg-blue-50 text-blue-600 border border-blue-100 shadow-sm mb-4">
                    <i class="fa-solid fa-graduation-cap text-2xl"></i>
                </div>
                <h1 class="text-2xl font-bold tracking-tight text-slate-900">Selamat Datang</h1>
                <p class="text-slate-500 text-sm mt-1">Masukkan akun Anda untuk mengakses Portal Soal TKA</p>
            </div>

            <!-- Form -->
            <form id="loginForm" class="space-y-5">
                
                <!-- Input Username -->
                <div>
                    <label for="username" class="block text-xs font-bold uppercase tracking-wider text-slate-600 mb-2">
                        Username
                    </label>
                    <div class="relative">
                        <div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-slate-400">
                            <i class="fa-regular fa-user text-sm"></i>
                        </div>
                        <input 
                            type="text" 
                            id="username" 
                            placeholder="Masukkan Username" 
                            required 
                            autocomplete="off"
                            class="w-full pl-10 pr-4 py-3 bg-slate-50 border border-slate-200 rounded-xl text-slate-900 text-sm placeholder-slate-400 focus:outline-none focus:border-blue-600 focus:bg-white focus:ring-4 focus:ring-blue-100 transition duration-200"
                        >
                    </div>
                </div>

                <!-- Input Password -->
                <div>
                    <label for="password" class="block text-xs font-bold uppercase tracking-wider text-slate-600 mb-2">
                        Kata Sandi
                    </label>
                    <div class="relative">
                        <div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-slate-400">
                            <i class="fa-solid fa-lock text-sm"></i>
                        </div>
                        <input 
                            type="password" 
                            id="password" 
                            placeholder="Masukkan Password" 
                            required
                            class="w-full pl-10 pr-10 py-3 bg-slate-50 border border-slate-200 rounded-xl text-slate-900 text-sm placeholder-slate-400 focus:outline-none focus:border-blue-600 focus:bg-white focus:ring-4 focus:ring-blue-100 transition duration-200"
                        >
                        <button 
                            type="button" 
                            id="togglePassword"
                            class="absolute inset-y-0 right-0 pr-3.5 flex items-center text-slate-400 hover:text-slate-600 transition"
                        >
                            <i class="fa-regular fa-eye text-sm" id="eyeIcon"></i>
                        </button>
                    </div>
                </div>

                <!-- Error Message -->
                <div id="errorMessage" class="hidden p-3.5 bg-red-50 border border-red-200 rounded-xl text-red-600 text-xs flex items-center gap-2">
                    <i class="fa-solid fa-circle-exclamation text-sm shrink-0"></i>
                    <span>Username atau kata sandi salah.</span>
                </div>

                <!-- Submit Button -->
                <button 
                    type="submit" 
                    class="w-full py-3.5 px-4 bg-blue-600 hover:bg-blue-700 active:bg-blue-800 text-white text-sm font-semibold rounded-xl shadow-md shadow-blue-600/20 active:scale-[0.99] transition duration-200 flex items-center justify-center gap-2 mt-2"
                >
                    <span>Masuk</span>
                    <i class="fa-solid fa-arrow-right text-xs"></i>
                </button>
            </form>

            <!-- Footer Card -->
            <div class="mt-8 pt-6 border-t border-slate-100 text-center">
                <p class="text-xs text-slate-400">
                    &copy; 2026 bimtolproject
                </p>
            </div>
        </div>
    </main>

    <script>
        // 1. AUTO-LOGIN CHECK
        document.addEventListener('DOMContentLoaded', () => {
            const isLoggedIn = localStorage.getItem('isLoggedIn');
            if (isLoggedIn === 'true') {
                window.location.href = "home.html";
            }
        });

        // Toggle visibility password
        const togglePassword = document.getElementById('togglePassword');
        const passwordInput = document.getElementById('password');
        const eyeIcon = document.getElementById('eyeIcon');

        togglePassword.addEventListener('click', () => {
            const isPassword = passwordInput.getAttribute('type') === 'password';
            passwordInput.setAttribute('type', isPassword ? 'text' : 'password');
            eyeIcon.classList.toggle('fa-eye', !isPassword);
            eyeIcon.classList.toggle('fa-eye-slash', isPassword);
        });

        // 2. LOGIC LOGIN
        document.getElementById('loginForm').addEventListener('submit', function(event) {
            event.preventDefault();

            const usernameInput = document.getElementById('username').value.trim();
            const passwordInput = document.getElementById('password').value.trim();
            const errorMessage = document.getElementById('errorMessage');

            // Data Pengguna
            const users = {
                "haikal": "haikal2233",
                "bima": "bima9900",
                "samuel": "samuel7722",
                "firman": "ujang7890",
                "dika": "dika1122",
                "rizal": "rizal7888",
                "narno": "narno0022",
                "latif": "latif5532",
                "adit": "adit7788",
                "hefan": "hefan6622",
                "hudan": "hudan4433"
            };

            // Validasi Credential
            if (users[usernameInput] && users[usernameInput] === passwordInput) {
                errorMessage.classList.add('hidden');

                // Simpan Sesi Login
                localStorage.setItem('isLoggedIn', 'true');
                localStorage.setItem('loggedInUser', usernameInput);

                // Redirect
                window.location.href = "home.html"; 
            } else {
                errorMessage.classList.remove('hidden');
            }
        });
    </script>
</body>
</html>
